    <style>
      /* Critical CSS inline biar nggak ada flash putih pas first paint */
      html,
      body,
      #root {
        height: 100%;
      }
      body {
        margin: 0;
        background: #07070d;
        color: #e5e7eb;
        font-family: 'Inter var', Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 18px;
        background: radial-gradient(1200px 600px at 50% -10%, rgba(139, 92, 246, 0.16), transparent 60%), #07070d;
        z-index: 999;
        transition: opacity 0.4s ease;
      }
      #boot .ring {
        width: 46px;
        height: 46px;
        border-radius: 999px;
        border: 2px solid rgba(139, 92, 246, 0.25);
        border-top-color: #22d3ee;
        animation: bootspin 0.9s linear infinite;
      }
      #boot p {
        color: #9ca3af;
        font-size: 13px;
        letter-spacing: 0.02em;
      }
      @keyframes bootspin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>

    <div id="root">
